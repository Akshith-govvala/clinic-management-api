# Alembic configuration file

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

[alembic]
# path to migration scripts
script_location = alembic

# template used to generate migration file names
file_template = %%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present
# defaults to the current directory
prepend_sys_path = .

# timezone to use when rendering the date
# within the "dateseconds" timestamp (assumed by default)
# timezone =

# max length of characters to apply to the
# "slug" field
# truncate_slug_length = 40

# set to 'true' to run the environment during
# the generate_revision process
# environment during the generate_revision process
# is generated, the environment is
# loaded in again and then called to produce the
# new migration script
# the Mako template's get_context()
# function to populate the template namespace
# defaults to env -> None
# initialize_on_migrate = true

# set to 'false' to avoid truncating long names
# for the genertion of constraint names
# defaults to true
# truncate_slug_length = 40

# set to 'true' to run the environment during
# the generate_revision process
# defaults to false
# run_migrations_online = true

sqlalchemy.url = sqlite:///./clinic.db
